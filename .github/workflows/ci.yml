name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sourcemark
          POSTGRES_PASSWORD: sourcemark
          POSTGRES_DB: sourcemark_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sourcemark" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://sourcemark:sourcemark@localhost:5432/sourcemark_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/contract
      - name: Contract tests (fixtures, exported JSON Schema up to date)
        run: npm test -w packages/contract
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/api

  analysis:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analysis/requirements-dev.txt
      - run: pip install -r services/analysis/requirements-dev.txt
      - run: pytest -q
        working-directory: services/analysis
      - name: Evaluation baseline (rules only, deterministic)
        run: python eval/run.py --no-ai
      - name: Evaluation with Gemini
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: python eval/run.py
