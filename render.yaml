# Render Blueprint, free plan: Express API and analysis service as free web services.
# The database is Supabase Postgres (pgvector), and the frontend (apps/web) deploys to Vercel.
# Steps and the values to fill in: docs/DEPLOY.md.
#
# Free web services sleep after ~15 minutes without traffic; the first request then takes 30-60 s.
# To upgrade, set plan: starter on both services (and optionally make the analysis service a
# private service, type: pserv, reached through fromService hostport).

services:
  - type: web
    name: sourcemark-analysis
    runtime: docker
    plan: free
    dockerContext: ./services/analysis
    dockerfilePath: ./services/analysis/Dockerfile
    healthCheckPath: /health
    envVars:
      # Public on the free plan, so every request must carry this token (the API sends it).
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: DATABASE_URL         # Supabase session pooler connection string
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"

  - type: web
    name: sourcemark-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL         # same Supabase session pooler connection string
        sync: false
      - key: ANALYSIS_URL         # public URL of sourcemark-analysis, e.g. https://sourcemark-analysis.onrender.com
        sync: false
      - key: ANALYSIS_TOKEN
        fromService:
          type: web
          name: sourcemark-analysis
          envVarKey: INTERNAL_TOKEN
      - key: SUPABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS         # the Vercel URL, e.g. https://sourcemark.vercel.app
        sync: false
