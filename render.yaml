# Render Blueprint: Express API and analysis service, both public web services on the free plan.
# The database is Supabase Postgres with pgvector (Render's free Postgres expires after 30 days),
# so DATABASE_URL is set by hand on both services. The frontend (apps/web) deploys separately to Vercel.
#
# Private services are not available on the free plan, so the analysis service is a public web service
# that rejects every request without INTERNAL_TOKEN. Only the API holds that token.
services:
  - type: web
    name: sourcemark-analysis
    runtime: docker
    plan: free
    dockerContext: ./services/analysis
    dockerfilePath: ./services/analysis/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: DATABASE_URL     # Supabase connection string
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"

  - type: web
    name: sourcemark-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL     # same Supabase connection string
        sync: false
      - key: ANALYSIS_URL     # public URL of sourcemark-analysis, e.g. https://sourcemark-analysis.onrender.com
        sync: false
      - key: ANALYSIS_TOKEN
        fromService:
          type: web
          name: sourcemark-analysis
          envVarKey: INTERNAL_TOKEN
      - key: SUPABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
