# Render Blueprint: Express API (public), analysis service (private network only), Postgres.
# The frontend (apps/web) deploys separately to Vercel.
databases:
  - name: sourcemark-db
    databaseName: sourcemark
    plan: basic-256mb   # pgvector is available on Render Postgres; free databases expire after 30 days

services:
  - type: pserv          # private service: reachable only from other services in this workspace
    name: sourcemark-analysis
    runtime: docker
    plan: starter
    dockerContext: ./services/analysis
    dockerfilePath: ./services/analysis/Dockerfile
    envVars:
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sourcemark-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"

  - type: web
    name: sourcemark-api
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sourcemark-db
          property: connectionString
      - key: ANALYSIS_URL
        fromService:
          type: pserv
          name: sourcemark-analysis
          property: hostport
      - key: ANALYSIS_TOKEN
        fromService:
          type: pserv
          name: sourcemark-analysis
          envVarKey: INTERNAL_TOKEN
      - key: SUPABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
